<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>RankTier</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23ff4f4f' width='64' height='64' rx='10'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' font-family='system-ui' font-weight='800'%3ES%3C/text%3E%3C/svg%3E" />
  <script>
    document.documentElement.classList.toggle(
      "choose",
      !new URLSearchParams(location.search).get("type") &&
      !new URLSearchParams(location.search).get("list")
    );
  </script>
  <style>
    :root {
      --bg: #000;
      --row: #29292b;
      --line: #000;
      --s: #ff4f4f;
      --a: #ff8c2e;
      --b: #ffcc33;
      --c: #8cd652;
      --d: #61baf2;
      --f: #ba9eed;
      --label: 88px;
      --tile: 88px;
      --tray-tile: 80px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
      border-bottom: 1px solid #1a1a1a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand a {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 13px;
    }
    .brand a:hover { color: #fff; }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, label.btn {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      min-height: 44px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: #2c2c2e;
      color: #fff;
    }
    label.btn { display: inline-flex; align-items: center; }
    button.primary, label.btn.primary { background: #ff8c2e; color: #111; }
    button.danger { background: #3a1d1d; color: #ffb4b4; }
    #file { display: none; }
    .savebar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: #111;
      border-bottom: 1px solid #1a1a1a;
    }
    .savebar input, .savebar select {
      appearance: none;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1c1c1e;
      color: #fff;
      font: inherit;
      min-height: 44px;
      padding: 8px 10px;
    }
    .savebar input { flex: 1 1 160px; min-width: 140px; }
    .savebar select { flex: 1 1 140px; }
    .save-status { color: rgba(255,255,255,0.55); font-size: 13px; }
    main { padding: 16px; max-width: 1200px; margin: 0 auto; }
    .stage { display: contents; }
    .board {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--line);
      border-radius: 4px;
      overflow: hidden;
    }
    .row {
      display: flex;
      min-height: var(--tile);
      background: var(--row);
    }
    .row.over { outline: 3px solid #fff; outline-offset: -3px; }
    .label {
      flex: 0 0 var(--label);
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 800;
      color: #111;
      letter-spacing: -0.03em;
    }
    .s .label { background: var(--s); }
    .a .label { background: var(--a); }
    .b .label { background: var(--b); }
    .c .label { background: var(--c); }
    .d .label { background: var(--d); }
    .f .label { background: var(--f); }
    .drop {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      min-height: var(--tile);
    }
    .tile {
      width: var(--tile);
      height: var(--tile);
      object-fit: cover;
      display: block;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .tile.selected { outline: 3px solid #fff; outline-offset: -3px; }
    .tile:active { cursor: grabbing; }
    .hint {
      margin: 16px 0 8px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }
    .tray {
      min-height: 104px;
      padding: 8px;
      background: var(--row);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tray.over { border-color: #fff; }
    .tray .tile {
      width: var(--tray-tile);
      height: var(--tray-tile);
      border-radius: 6px;
    }
    .empty {
      color: rgba(255,255,255,0.45);
      font-size: 14px;
      padding: 28px 8px;
    }
    body.mode-iceberg {
      background: #061018;
    }
    .board.iceberg {
      max-width: 520px;
      margin: 0 auto;
      background: transparent;
      overflow: visible;
      position: relative;
    }
    .iceberg-frame {
      position: relative;
      width: 100%;
    }
    .iceberg-frame > img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }
    .mode-iceberg .stage {
      display: grid;
      grid-template-columns: minmax(0, 520px) 96px;
      grid-template-rows: auto auto;
      column-gap: 8px;
      max-width: 640px;
      margin: 0 auto;
    }
    .mode-iceberg .board {
      grid-column: 1;
      grid-row: 1;
    }
    .mode-iceberg .board.iceberg {
      max-width: none;
    }
    .mode-iceberg .hint {
      grid-column: 1 / -1;
      grid-row: 2;
    }
    .mode-iceberg .row {
      position: absolute;
      left: 0;
      right: 18.5%;
      min-height: 0;
      background: transparent;
      border: 0;
    }
    .mode-iceberg .row.over {
      outline: none;
      background: rgba(255,255,255,0.12);
    }
    .mode-iceberg .label {
      position: absolute;
      left: 6px;
      top: 4px;
      z-index: 2;
      flex: none;
      width: auto;
      max-width: 46%;
      height: auto;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.15;
      text-align: left;
      padding: 3px 6px;
      color: #fff;
      text-shadow: 0 1px 2px #000, 0 0 6px #000;
      background: rgba(0,0,0,0.35);
      border-radius: 3px;
    }
    .mode-iceberg .drop {
      width: 100%;
      height: 100%;
      min-height: 0;
      align-content: flex-start;
      padding: 22px 8px 4px;
    }
    .mode-iceberg .tile {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,0.35);
    }
    .mode-iceberg .tray {
      grid-column: 2;
      grid-row: 1;
      position: static;
      align-self: stretch;
      min-height: 0;
      margin: 0;
      padding: 6px 4px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      background: rgba(8, 12, 18, 0.72);
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: center;
      align-content: flex-start;
      overflow-y: auto;
    }
    .mode-iceberg .tray .tile {
      width: min(72px, 100%);
      height: auto;
      aspect-ratio: 1;
      border-radius: 2px;
    }
    .mode-iceberg .hint { text-align: center; }
    html.choose header, html.choose .savebar, html.choose main { display: none !important; }
    .credit {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    html.choose .credit {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
    }
    html:not(.choose) .chooser { display: none; }
    .chooser {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      padding-top: max(28px, env(safe-area-inset-top));
    }
    .chooser-home {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 13px;
    }
    .chooser-home:hover { color: #fff; }
    .chooser-inner { width: min(720px, 100%); text-align: center; }
    .chooser-kicker {
      margin: 0 0 8px;
      color: #ff8c2e;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .chooser-inner h2 {
      margin: 0 0 24px;
      font-size: clamp(28px, 6vw, 40px);
    }
    .chooser-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .chooser-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      text-decoration: none;
      color: #fff;
      background: #141416;
      border: 1px solid #2a2a2e;
      border-radius: 14px;
      padding: 20px;
      min-height: 180px;
    }
    .chooser-card:hover { border-color: #fff; }
    .chooser-card strong { font-size: 20px; }
    .chooser-card span { color: rgba(255,255,255,0.62); font-size: 14px; }
    .mini-sf, .mini-ice {
      display: flex;
      overflow: hidden;
      border-radius: 6px;
      height: 44px;
    }
    .mini-sf i { flex: 1; }
    .mini-sf .s { background: #ff4f4f; }
    .mini-sf .a { background: #ff8c2e; }
    .mini-sf .b { background: #ffcc33; }
    .mini-sf .c { background: #8cd652; }
    .mini-sf .d { background: #61baf2; }
    .mini-sf .f { background: #ba9eed; }
    .mini-ice { flex-direction: column; }
    .mini-ice i { flex: 1; }
    .mini-ice i:nth-child(1) { background: #d6eef7; }
    .mini-ice i:nth-child(2) { background: #6aa7c3; }
    .mini-ice i:nth-child(3) { background: #3a7ea0; }
    .mini-ice i:nth-child(4) { background: #1a3e59; }
    .mini-ice i:nth-child(5) { background: #08131e; }
    @media (max-width: 700px) {
      :root { --label: 48px; --tile: 64px; --tray-tile: 64px; }
      header { flex-direction: column; align-items: stretch; }
      .actions { width: 100%; }
      .actions .btn, .actions button { flex: 1; justify-content: center; }
      .label { font-size: 26px; }
      .board.iceberg, .mode-iceberg .stage { max-width: 100%; }
      .mode-iceberg .stage { grid-template-columns: minmax(0, 1fr) 72px; }
      .mode-iceberg .label { font-size: 7px; max-width: 58%; }
      .mode-iceberg .tile { width: 36px; height: 36px; }
      .mode-iceberg .tray .tile { width: min(44px, 100%); }
      .chooser-grid { grid-template-columns: 1fr; }
      main { padding: 12px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>RankTier</h1>
      <a href="../index.html" id="home-link">Home</a>
      <a href="index.html" id="boards-link">Boards</a>
      <a href="index.html?type=iceberg" id="mode-link">Iceberg</a>
    </div>
    <div class="actions">
      <label class="btn primary" for="file">Add Images</label>
      <input id="file" type="file" accept="image/*" multiple />
      <button type="button" id="reset">Reset ranks</button>
      <button type="button" class="danger" id="clear">Clear all</button>
    </div>
  </header>
  <div class="savebar">
    <input id="list-title" type="text" maxlength="80" placeholder="List title" value="Untitled list" />
    <select id="saved-lists" aria-label="Saved lists">
      <option value="">Saved lists</option>
    </select>
    <button type="button" id="new-list">New list</button>
    <span class="save-status" id="save-status">Lists save automatically</span>
  </div>
  <main>
    <div class="stage" id="stage">
      <div class="board" id="board"></div>
      <p class="hint" id="hint">Add images, then drag them into a tier to lock them in.</p>
      <div class="tray" id="tray" data-zone="tray"></div>
    </div>
  </main>
  <div class="chooser" id="chooser">
    <a class="chooser-home" href="../index.html">Home</a>
    <div class="chooser-inner">
      <p class="chooser-kicker">Choose a board</p>
      <h2>How do you want to rank?</h2>
      <div class="chooser-grid">
        <a class="chooser-card" href="index.html?type=classic">
          <div class="mini-sf" aria-hidden="true"><i class="s"></i><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="f"></i></div>
          <strong>S–F board</strong>
          <span>Classic tiers from S down to F.</span>
        </a>
        <a class="chooser-card" href="index.html?type=iceberg">
          <div class="mini-ice" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <strong>Iceberg</strong>
          <span>Well-known at the top, obscure at the bottom.</span>
        </a>
      </div>
    </div>
  </div>
  <footer class="credit">Made by SDL (Aahil Irfan)</footer>
  <script>
    const CLASSIC_TIERS = [
      { id: "s", label: "S" },
      { id: "a", label: "A" },
      { id: "b", label: "B" },
      { id: "c", label: "C" },
      { id: "d", label: "D" },
      { id: "f", label: "F" },
    ];
    const ICEBERG_TIERS = [
      { id: "surface", label: "THE SURFACE", top: 0, height: 9.53 },
      { id: "below", label: "JUST BELOW THE SURFACE", top: 9.53, height: 9.56 },
      { id: "upper-limbo", label: "UPPER LIMBO", top: 19.09, height: 11.27 },
      { id: "lower-limbo", label: "LOWER LIMBO", top: 30.36, height: 10.06 },
      { id: "depths", label: "THE DEPTHS", top: 40.42, height: 10.24 },
      { id: "abyss", label: "THE ABYSS", top: 50.66, height: 9.13 },
      { id: "void", label: "THE VOID", top: 59.79, height: 40.21 },
    ];
    const params = new URLSearchParams(location.search);
    function normalizeType(type) {
      if (type === "iceberg" || type === "iceberg-drawn") return "iceberg";
      return "classic";
    }
    let listType = normalizeType(params.get("type"));
    const TIERS = () => (listType === "iceberg" ? ICEBERG_TIERS : CLASSIC_TIERS);

    const items = new Map();
    const order = { tray: [] };
    let selected = null;
    let listId = crypto.randomUUID();
    let saveTimer = 0;
    let hydrating = false;
    [...CLASSIC_TIERS, ...ICEBERG_TIERS].forEach((t) => { order[t.id] = []; });

    const board = document.getElementById("board");
    const hint = document.getElementById("hint");
    const file = document.getElementById("file");
    const titleInput = document.getElementById("list-title");
    const savedSelect = document.getElementById("saved-lists");
    const saveStatus = document.getElementById("save-status");

    if (location.protocol === "file:" || !document.referrer && location.pathname.endsWith("/index.html") === false) {
      const link = document.getElementById("home-link");
      if (link && (location.protocol === "file:" || !location.pathname.includes("/app"))) {
        link.hidden = location.protocol !== "http:" && location.protocol !== "https:";
        const chooserHome = document.querySelector(".chooser-home");
        if (chooserHome) chooserHome.hidden = link.hidden;
      }
    }

    function applyMode() {
      document.body.classList.toggle("mode-iceberg", listType === "iceberg");
      board.classList.toggle("iceberg", listType === "iceberg");
      document.title = listType === "iceberg" ? "RankTier Iceberg" : "RankTier";
      const modeLink = document.getElementById("mode-link");
      if (modeLink) {
        if (listType === "iceberg") {
          modeLink.href = "index.html?type=classic";
          modeLink.textContent = "S–F board";
        } else {
          modeLink.href = "index.html?type=iceberg";
          modeLink.textContent = "Iceberg";
        }
      }
      if (listType === "iceberg" && titleInput.value === "Untitled list") {
        titleInput.value = "Untitled iceberg";
      }
    }

    function appendIcebergRows(parent) {
      TIERS().forEach((t) => {
        const row = document.createElement("div");
        row.className = `row ${t.id}`;
        row.style.top = `${t.top}%`;
        row.style.height = `${t.height}%`;
        row.innerHTML = `<div class="label">${t.label}</div><div class="drop" data-zone="${t.id}"></div>`;
        parent.appendChild(row);
      });
    }

    function rebuildBoard() {
      applyMode();
      board.replaceChildren();
      if (listType === "iceberg") {
        const frame = document.createElement("div");
        frame.className = "iceberg-frame";
        frame.innerHTML = `<img src="iceberg-template.png" alt="Iceberg template">`;
        appendIcebergRows(frame);
        board.appendChild(frame);
      } else {
        TIERS().forEach((t) => {
          const row = document.createElement("div");
          row.className = `row ${t.id}`;
          row.innerHTML = `<div class="label">${t.label}</div><div class="drop" data-zone="${t.id}"></div>`;
          board.appendChild(row);
        });
      }
      board.querySelectorAll("[data-zone]").forEach(bindZone);
    }

    function uid() {
      return crypto.randomUUID();
    }

    function listUrl(id) {
      const q = new URLSearchParams();
      q.set("type", listType === "iceberg" ? "iceberg" : "classic");
      if (id) q.set("list", id);
      const query = q.toString();
      return location.pathname + (query ? `?${query}` : "");
    }

    function zoneIds() {
      return ["tray", ...TIERS().map((t) => t.id)];
    }

    function findZone(id) {
      for (const [zone, ids] of Object.entries(order)) {
        if (ids.includes(id)) return zone;
      }
      return null;
    }

    function move(id, dest, index) {
      const from = findZone(id);
      if (!from) return;
      order[from] = order[from].filter((x) => x !== id);
      const list = order[dest];
      const at = Math.min(Math.max(index ?? list.length, 0), list.length);
      list.splice(at, 0, id);
      render();
      queueSave();
    }

    function tileFor(id) {
      const img = document.createElement("img");
      img.className = "tile";
      img.draggable = true;
      img.src = items.get(id);
      img.alt = "Ranked item";
      img.dataset.id = id;
      img.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", id);
        e.dataTransfer.effectAllowed = "move";
      });
      img.addEventListener("dblclick", () => {
        selected = null;
        move(id, "tray");
      });
      img.addEventListener("click", (e) => {
        e.stopPropagation();
        selected = selected === id ? null : id;
        render();
      });
      if (selected === id) img.classList.add("selected");
      return img;
    }

    function bindZone(el) {
      el.addEventListener("dragover", (e) => {
        e.preventDefault();
        el.classList.add("over");
        el.closest(".row")?.classList.add("over");
      });
      el.addEventListener("dragleave", () => {
        el.classList.remove("over");
        el.closest(".row")?.classList.remove("over");
      });
      el.addEventListener("drop", (e) => {
        e.preventDefault();
        el.classList.remove("over");
        el.closest(".row")?.classList.remove("over");
        const id = e.dataTransfer.getData("text/plain");
        if (!id || !items.has(id)) return;
        const kids = [...el.querySelectorAll(".tile")];
        let index = kids.length;
        for (let i = 0; i < kids.length; i++) {
          const r = kids[i].getBoundingClientRect();
          if (e.clientX < r.left + r.width / 2) {
            index = i;
            break;
          }
        }
        move(id, el.dataset.zone, index);
      });
      el.addEventListener("click", () => {
        if (!selected || !items.has(selected)) return;
        const id = selected;
        selected = null;
        move(id, el.dataset.zone);
      });
    }

    function render() {
      document.querySelectorAll("[data-zone]").forEach((zoneEl) => {
        const zone = zoneEl.dataset.zone;
        zoneEl.replaceChildren();
        order[zone].forEach((id) => zoneEl.appendChild(tileFor(id)));
        if (zone === "tray" && order.tray.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No images yet";
          zoneEl.appendChild(empty);
        }
      });
      const narrow = window.matchMedia("(max-width: 700px)").matches;
      const place = listType === "iceberg" ? "layer" : "tier";
      if (!items.size) {
        hint.textContent = listType === "iceberg"
          ? (narrow ? "Add images, tap one, then tap a layer. Surface is well-known; the void is the most obscure." : "Add images, then drag them into a layer. The surface is well-known; the void is the most obscure.")
          : (narrow ? "Add images, tap one, then tap a tier to lock it in." : "Add images, then drag them into a tier to lock them in.");
      } else if (selected) {
        hint.textContent = `Tap a ${place} to lock the selected image in, or tap it again to cancel.`;
      } else {
        hint.textContent = narrow
          ? `Tap an image, then tap a ${place}. Double-tap a ranked image to send it back.`
          : `Drag an image into a ${place} to lock it in. Double-click a ranked image to send it back to the tray.`;
      }
    }

    if (document.documentElement.classList.contains("choose")) {
      document.title = "RankTier";
    } else {
      rebuildBoard();
      bindZone(document.getElementById("tray"));
    }

    function snapshot() {
      return {
        id: listId,
        type: listType,
        title: titleInput.value.trim() || (listType === "iceberg" ? "Untitled iceberg" : "Untitled list"),
        updatedAt: new Date().toISOString(),
        order: Object.fromEntries(zoneIds().map((k) => [k, [...(order[k] || [])]])),
        items: Object.fromEntries(items),
      };
    }

    function applyList(data) {
      hydrating = true;
      listType = normalizeType(data.type);
      listId = data.id || uid();
      titleInput.value = data.title || (listType === "iceberg" ? "Untitled iceberg" : "Untitled list");
      items.clear();
      Object.entries(data.items || {}).forEach(([id, src]) => items.set(id, src));
      order.tray = [];
      [...CLASSIC_TIERS, ...ICEBERG_TIERS].forEach((t) => { order[t.id] = []; });
      const incoming = data.order || {};
      zoneIds().forEach((zone) => {
        order[zone] = (incoming[zone] || []).filter((id) => items.has(id));
      });
      rebuildBoard();
      hydrating = false;
      render();
      history.replaceState({}, "", listUrl(listId));
    }

    function emptyBoard() {
      items.clear();
      order.tray = [];
      [...CLASSIC_TIERS, ...ICEBERG_TIERS].forEach((t) => { order[t.id] = []; });
    }

    function setStatus(text) {
      saveStatus.textContent = text;
    }

    async function refreshSavedOptions() {
      const current = listId;
      let lists = [];
      try {
        const res = await fetch("/api/lists");
        if (res.ok) lists = await res.json();
      } catch {
        const cached = localStorage.getItem("ranktier:index");
        lists = cached ? JSON.parse(cached) : [];
      }
      lists = lists.filter((list) => normalizeType(list.type) === listType);
      savedSelect.replaceChildren();
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = lists.length ? "Open a saved list" : "No saved lists yet";
      savedSelect.appendChild(placeholder);
      lists.forEach((list) => {
        const opt = document.createElement("option");
        opt.value = list.id;
        opt.textContent = `${list.title} (${list.itemCount || 0})`;
        if (list.id === current) opt.selected = true;
        savedSelect.appendChild(opt);
      });
    }

    async function persist() {
      if (hydrating) return;
      const data = snapshot();
      localStorage.setItem("ranktier:current", JSON.stringify(data));
      localStorage.setItem("ranktier:last-id", data.id);
      try {
        const res = await fetch("/api/lists", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!res.ok) throw new Error("save failed");
        setStatus("Saved");
        await refreshSavedOptions();
      } catch {
        setStatus("Saved on this device");
      }
    }

    function queueSave() {
      if (hydrating) return;
      setStatus("Saving…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(persist, 400);
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 280;
          let w = img.width;
          let h = img.height;
          if (w > max || h > max) {
            const scale = max / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Could not read image"));
        };
        img.src = url;
      });
    }

    file.addEventListener("change", async () => {
      for (const f of file.files) {
        try {
          const src = await fileToDataUrl(f);
          const id = uid();
          items.set(id, src);
          order.tray.push(id);
        } catch {
          setStatus("Skipped an unreadable image");
        }
      }
      file.value = "";
      render();
      queueSave();
    });

    document.getElementById("reset").addEventListener("click", () => {
      TIERS().forEach((t) => {
        order.tray.push(...(order[t.id] || []));
        order[t.id] = [];
      });
      render();
      queueSave();
    });

    document.getElementById("clear").addEventListener("click", () => {
      emptyBoard();
      render();
      queueSave();
    });

    titleInput.addEventListener("input", queueSave);

    document.getElementById("new-list").addEventListener("click", () => {
      listId = uid();
      titleInput.value = listType === "iceberg" ? "Untitled iceberg" : "Untitled list";
      emptyBoard();
      render();
      history.replaceState({}, "", listUrl());
      queueSave();
    });

    savedSelect.addEventListener("change", async () => {
      const id = savedSelect.value;
      if (!id) return;
      try {
        const res = await fetch(`/api/lists/${id}`);
        if (res.ok) {
          applyList(await res.json());
          history.replaceState({}, "", listUrl(id));
          queueSave();
          return;
        }
      } catch { /* use local copy */ }
      const cached = localStorage.getItem("ranktier:current");
      if (cached) {
        const data = JSON.parse(cached);
        if (data.id === id) applyList(data);
      }
    });

    function matchesMode(data) {
      return normalizeType(data?.type) === listType;
    }

    async function boot() {
      const wanted = params.get("list") || localStorage.getItem("ranktier:last-id");
      if (wanted) {
        try {
          const res = await fetch(`/api/lists/${wanted}`);
          if (res.ok) {
            const data = await res.json();
            if (params.get("list") || matchesMode(data)) {
              applyList(data);
              await refreshSavedOptions();
              return;
            }
          }
        } catch { /* fall through */ }
        const cached = localStorage.getItem("ranktier:current");
        if (cached) {
          const data = JSON.parse(cached);
          if (params.get("list") || matchesMode(data)) applyList(data);
        }
      }
      applyMode();
      await refreshSavedOptions();
    }

    if (!document.documentElement.classList.contains("choose")) {
      render();
      boot();
    }
  </script>
</body>
</html>
